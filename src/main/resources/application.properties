spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techlab_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Carga data.sql despues de que Hibernate cree/actualice las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
